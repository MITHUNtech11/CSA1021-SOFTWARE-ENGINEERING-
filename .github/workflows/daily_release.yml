name: Scheduled Lab Experiments Release

on:
  schedule:
    # Runs hourly between 04:00 UTC and 14:00 UTC (09:30 AM to 07:30 PM IST)
    - cron: '0 4-14/1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git identity
        run: |
          git config user.name "Mithun"
          git config user.email "mithunsenthils4056.sse@saveetha.com"

      - name: Run Release Dispatcher
        run: python scripts/release_dispatcher.py
