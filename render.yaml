services:
  - type: web
    name: esportecho-gateway
    branch: deploy/esportecho-vercel
    runtime: docker
    plan: free
    rootDir: Capstone
    healthCheckPath: /health
    buildFilter:
      paths:
        - Capstone/services/**
        - Capstone/shared/**
        - Capstone/data/**
        - Capstone/.dockerignore
        - Capstone/Dockerfile
        - render.yaml
    envVars:
      - key: PORT
        value: "8000"
      - key: ESPORTECHO_DASHBOARD_ORIGIN
        sync: false
