apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
      - name: api-backend
        image: python:3.11-slim
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
          requests:
            cpu: "100m"
