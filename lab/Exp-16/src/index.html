<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSA1021 - Containerized Cloud Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 Containerized Static Portal</h1>
      <p class="badge">Served via Nginx Alpine on Docker</p>

    <main>
      <div class="card">
        <h3>Container Status</h3>
        <p>Status: <span class="status-online">ONLINE</span></p>
        <p>Port: 8080 -> 80 (Internal Nginx)</p>
        <p>Host: docker-desktop-linux</p>
      </div>
    </main>
  </div>
</body>
</html>
