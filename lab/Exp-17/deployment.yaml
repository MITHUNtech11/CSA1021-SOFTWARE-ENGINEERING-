apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-order-api-deployment
  labels:
    app: flask-order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-order-api
  template:
    metadata:
      labels:
        app: flask-order-api
    spec:
      containers:
      - name: flask-order-api
        image: mithun/flask-order-api:1.0.0
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
