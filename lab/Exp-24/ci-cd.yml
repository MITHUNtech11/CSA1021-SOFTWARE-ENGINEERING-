name: Flask CI/CD Staging Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: pip install flake8 pytest flask
    - name: Run Flake8 Linter
      run: flake8 . --count --max-line-length=127 --statistics
    - name: Run Pytest Suite
      run: pytest test_api.py -v

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Container
      run: docker build -t mithun/flask-app:staging .
    - name: Deploy to Cloud Staging
      run: echo "Deployed successfully to cloud cluster!"
